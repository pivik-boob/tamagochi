<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Я Тамагочи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f0f0;
            --device-body-color: #FF7000;
            --device-body-shadow: #E65A00;
            --screen-bezel: #FFD300;
            --screen-bg-placeholder: #8D9E71;
            
            --btn-feed: #FF4B4B;
            --btn-play: #66CC66;
            --btn-sleep: #66CCFF;
            --btn-status: #CC99FF;
            --btn-text-color: #FFFFFF;
            
            --heart-color: #FF0000;
            --clean-text-color: #00FF00;
            
            --font-pixel: 'VT323', monospace;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-pixel);
            image-rendering: pixelated;
        }

        #tamagotchi-device {
            width: 450px;
            height: 600px;
            background: linear-gradient(135deg, var(--device-body-color), var(--device-body-shadow));
            border-radius: 50% / 30%;
            border: 15px solid var(--device-body-shadow);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        #physical-buttons {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
        }
        .physical-btn {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, var(--device-body-shadow) 0%, rgba(0,0,0,0.1) 70%, rgba(0,0,0,0.3) 100%);
            border-radius: 50%;
            border: 6px solid var(--device-body-shadow);
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }
        .physical-btn::after {
            content: '';
            position: absolute;
            top: 10%; left: 10%; width: 80%; height: 80%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        #screen-bezel {
            width: 100%;
            height: 400px;
            background-color: var(--screen-bezel);
            border-radius: 20px;
            border: 15px solid var(--device-body-shadow);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #screen-display {
            width: 100%;
            height: 100%;
            background-color: var(--screen-bg-placeholder);
            border-radius: 5px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #000;
        }

        #top-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            height: 30px;
            z-index: 2;
        }

        .heart { width: 25px; height: 25px; }
        .heart.active { fill: var(--heart-color); }
        #food-bowl { width: 35px; height: 20px; fill: #FF4B4B; }
        #clean-status { color: var(--clean-text-color); font-size: 24px; margin-left: auto; }

        #content-layer {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Твой фон */
        #screen-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('bg.png'); 
            background-size: cover;
            background-position: center;
        }

        .floating-element { position: absolute; image-rendering: pixelated; z-index: 2; }
        #floating-hearts {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 2;
        }
        .small-heart { width: 15px; height: 15px; fill: #FF66CC; }
        #butterfly-left { top: 60%; left: 10%; width: 30px; height: 25px; fill: #FF66CC; }
        #butterfly-right { top: 60%; right: 10%; width: 30px; height: 25px; fill: #9966FF; }

        /* Твой персонаж */
        #main-character {
            width: 150px;
            height: 250px;
            background-image: url('happy.gif'); /* Радостная гифка по умолчанию */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            z-index: 1;
        }

        #action-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            height: 50px;
            z-index: 2;
        }
        .action-btn {
            width: 70px;
            height: 35px;
            border-radius: 8px;
            border: 2px solid #000;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--btn-text-color);
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }
        .action-btn.feed { background-color: var(--btn-feed); }
        .action-btn.play { background-color: var(--btn-play); }
        .action-btn.sleep { background-color: var(--btn-sleep); }
        .action-btn.status { background-color: var(--btn-status); }
    </style>
</head>
<body>

    <div id="tamagotchi-device">
        <div id="screen-bezel">
            <div id="screen-display">
                
                <div id="top-bar">
                    <svg class="heart active" viewBox="0 0 7 6"><path d="M2,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M5,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M3,2h1v1h-1z" fill="#FFF"/></svg>
                    <svg class="heart active" viewBox="0 0 7 6"><path d="M2,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M5,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M3,2h1v1h-1z" fill="#FFF"/></svg>
                    <svg class="heart active" viewBox="0 0 7 6"><path d="M2,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M5,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M3,2h1v1h-1z" fill="#FFF"/></svg>
                    
                    <svg id="food-bowl" viewBox="0 0 10 5"><path d="M2,0h6v1h1v1h1v3h-10v-3h1v-1h1z"/><path d="M1,2h8v1h-1v-1h-6v1h-1z" fill="#E65A00"/><path d="M2,1h6v1h-6z" fill="#FFFFCC"/></svg>
                    <div id="clean-status">CLEAN</div>
                </div>
                
                <div id="content-layer">
                    <div id="screen-background"></div>
                    
                    <div id="floating-hearts">
                        <svg class="small-heart" viewBox="0 0 5 4"><path d="M1,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M4,0h1v1h-1v-1z" fill="#FFF"/></svg>
                        <svg class="small-heart" viewBox="0 0 5 4"><path d="M1,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M4,0h1v1h-1v-1z" fill="#FFF"/></svg>
                        <svg class="small-heart" viewBox="0 0 5 4"><path d="M1,0h1v1h1v1h-1v-1h-1v1h-1v1h-1v-1h1v-1h1v-1z"/><path d="M4,0h1v1h-1v-1z" fill="#FFF"/></svg>
                    </div>
                    
                    <svg id="butterfly-left" class="floating-element" viewBox="0 0 8 6"><path d="M0,0h3v1h-1v1h1v1h-1v1h1v1h-1v1h-2v-6z"/><path d="M5,0h3v6h-2v-1h1v-1h-1v-1h1v-1h-1v-1h1v-1h-2z" fill="#66CCFF"/><path d="M3,2h2v1h-2z" fill="#000"/><path d="M1,2h1v2h-1z" fill="#FFF"/><path d="M6,2h1v2h-1z" fill="#FFF"/></svg>
                    <svg id="butterfly-right" class="floating-element" viewBox="0 0 8 6"><path d="M0,0h3v1h-1v1h1v1h-1v1h1v1h-1v1h-2v-6z"/><path d="M5,0h3v6h-2v-1h1v-1h-1v-1h1v-1h-1v-1h1v-1h-2z" fill="#66CCFF"/><path d="M3,2h2v1h-2z" fill="#000"/><path d="M1,2h1v2h-1z" fill="#FFF"/><path d="M6,2h1v2h-1z" fill="#FFF"/></svg>
                    
                    <div id="main-character"></div>
                </div>
                
                <div id="action-bar">
                    <div class="action-btn feed">FEED</div>
                    <div class="action-btn play">PLAY</div>
                    <div class="action-btn sleep">SLEEP</div>
                    <div class="action-btn status">STATUS</div>
                </div>
                
            </div>
        </div>
        
        <div id="physical-buttons">
            <div class="physical-btn"></div>
            <div class="physical-btn"></div>
            <div class="physical-btn"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        const character = document.getElementById('main-character');
        let stats = { hunger: 50, happiness: 50 };

        function checkState() {
            if (stats.hunger < 30 || stats.happiness < 40) {
                character.style.backgroundImage = "url('sad.gif')";
            } else {
                character.style.backgroundImage = "url('happy.gif')";
            }
        }

        // Кнопка FEED (Кормить)
        document.querySelector('.action-btn.feed').addEventListener('click', () => {
            stats.hunger = 100;
            stats.happiness += 10;
            character.style.backgroundImage = "url('happy.gif')";
            setTimeout(checkState, 3000);
        });

        // Кнопка PLAY (Играть / Поцелуй)
        document.querySelector('.action-btn.play').addEventListener('click', () => {
            stats.happiness = 100;
            character.style.backgroundImage = "url('kiss.gif')";
            setTimeout(checkState, 2500); 
        });

        // Жизненный цикл (каждые 10 секунд)
        setInterval(() => {
            stats.hunger = Math.max(0, stats.hunger - 10);
            stats.happiness = Math.max(0, stats.happiness - 5);
            checkState();
        }, 10000);
    </script>
</body>
</html>
