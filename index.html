<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Я Тамагочи: Исправленная версия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Переменные цветов и шрифтов */
            --bg-color: #fce4ec; /* Розовый фон страницы */
            --font-pixel: 'VT323', monospace;
            --heart-color: #FF0000;
            --btn-text-color: #000000; 
            
            /* Цвета корпуса и рамки */
            --device-body-color: #FF7000;
            --device-body-shadow: #E65A00;
            --screen-bezel: #FFD300;
        }

        body {
            /* Убрали фон с body, он теперь внутри тамагочи */
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-pixel);
            image-rendering: pixelated; /* Сохраняем пиксельность для всего */
        }

        /* --- ВОССТАНАВЛИВАЕМ ФИЗИЧЕСКИЙ КОРПУС ТАМАГОЧИ --- */
        
        #tamagotchi-device {
            width: 450px;
            height: 600px;
            background: linear-gradient(135deg, var(--device-body-color), var(--device-body-shadow));
            border-radius: 50% / 30%; /* Овальная форма */
            border: 15px solid var(--device-body-shadow);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        /* Физические кнопки (неинтерактивные) */
        #physical-buttons {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
        }
        .physical-btn {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, var(--device-body-shadow) 0%, rgba(0,0,0,0.1) 70%, rgba(0,0,0,0.3) 100%);
            border-radius: 50%;
            border: 6px solid var(--device-body-shadow);
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }
        .physical-btn::after { /* Блик */
            content: '';
            position: absolute;
            top: 10%; left: 10%; width: 80%; height: 80%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        /* Желтая рамка экрана */
        #screen-bezel {
            width: 100%;
            height: 400px;
            background-color: var(--screen-bezel);
            border-radius: 20px;
            border: 15px solid var(--device-body-shadow);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ВНУТРЕННИЙ ЭКРАН ДИСПЛЕЯ --- */
        
        #screen-display {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            position: relative; 
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #000; /* Четкий пиксельный контур экрана */
            
            /* ТЕПЕРЬ ФОН ЗДЕСЬ! */
            background-image: url('bg.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* --- ПОКАЗАТЕЛИ СВЕРХУ (Сердца, Миска, CLEAN) --- */
        
        #top-bar {
            position: absolute;
            top: 10%; /* Сдвигаем вниз от верхнего края */
            left: 15%; /* Сдвигаем от левого края */
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            height: 30px;
            z-index: 2; /* Чтобы были поверх фона */
        }

        #hearts-container {
            display: flex;
            gap: 5px;
        }
        
        /* Монолитные красные сердечки */
        .heart {
            width: 25px;
            height: 25px;
            fill: #FF0000;
        }

        /* Текст CLEAN */
        #clean-status {
            color: #00FF00; /* Ярко-зеленый текст */
            font-size: 24px;
            margin-left: auto; /* Сдвигаем CLEAN вправо */
        }
        
        /* --- ТВОЙ ПЕРСОНАЖ --- */
        
        #main-character-container {
            position: absolute;
            top: 25%; /* Чуть ниже сердечек */
            left: 50%;
            transform: translateX(-50%); /* Центрируем */
            
            /* НОВЫЙ РАЗМЕР КОНТЕЙНЕРА, ЧТОБЫ ВПИСАТЬСЯ ЛУЧШЕ */
            width: 120px; 
            height: 200px;
            
            z-index: 1; /* Персонаж за кнопочками */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* УБИРАЕМ АБСОЛЮТНОЕ ПОЗИЦИОНИРОВАНИЕ И ПАДИНГИ ВНУТРИ, ЧТОБЫ ГИФКА ЛЕГЛА РОВНО */
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Облачко с текстом */
        #speech-bubble {
            position: absolute;
            top: -40px; /* Чуть выше */
            background: white;
            border: 2px solid black;
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 18px;
            color: black;
            white-space: nowrap;
            opacity: 0; /* Скрыто по умолчанию */
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            pointer-events: none;
            z-index: 10;
        }
        
        #main-character {
            width: 100%;
            height: 100%;
            background-image: url('base.gif'); /* Базовая гифка */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        /* --- КНОПКИ ДЕЙСТВИЙ (FEED, KISS) --- */
        
        #action-bar {
            position: absolute;
            bottom: 10%; /* Сдвигаем вверх от нижнего края */
            left: 50%;
            transform: translateX(-50%); /* Центрируем */
            display: flex;
            gap: 15px; /* Расстояние между кнопками */
            z-index: 3; /* Самый верхний слой, чтобы можно было нажать */
        }
        
        .action-btn {
            background-color: white; /* Белый фон для кнопок */
            color: var(--btn-text-color);
            font-size: 22px; 
            padding: 8px 20px;
            border-radius: 8px;
            border: 2px solid #000; /* Черный пиксельный контур */
            box-shadow: 0 4px 0 rgba(0,0,0,0.5); /* Объемная тень */
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

    </style>
</head>
<body>

    <div id="tamagotchi-device">
        <div id="screen-bezel">
            <div id="screen-display">
                
                <div id="top-bar">
                    <div id="hearts-container">
                        <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                    
                    <div id="clean-status">CLEAN</div>
                </div>
                
                <div id="main-character-container">
                    <div id="speech-bubble">Привет!</div>
                    <div id="main-character"></div>
                </div>
                
                <div id="action-bar">
                    <div class="action-btn" id="btn-feed">FEED</div>
                    <div class="action-btn" id="btn-kiss">KISS</div>
                </div>
                
            </div>
        </div>
        
        <div id="physical-buttons">
            <div class="physical-btn"></div>
            <div class="physical-btn"></div>
            <div class="physical-btn"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const character = document.getElementById('main-character');
        const speechBubble = document.getElementById('speech-bubble');
        
        let stats = { hunger: 50, happiness: 50 };
        let lastInteractionTime = Date.now(); 
        let speechTimeout;

        // Функция показа текста в облачке
        function speak(text, duration = 3000) {
            clearTimeout(speechTimeout);
            speechBubble.innerText = text;
            speechBubble.style.opacity = '1';
            speechTimeout = setTimeout(() => {
                speechBubble.style.opacity = '0';
            }, duration);
        }

        // Сохранение в облако Telegram
        function saveData() {
            const dataString = JSON.stringify({ hunger: stats.hunger, happiness: stats.happiness, lastInteractionTime });
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.setItem('tamagotchi_data', dataString, (err, success) => {
                    if (err) console.error("Ошибка сохранения в облако");
                });
            } else {
                localStorage.setItem('tamagotchi_data', dataString);
            }
        }

        // Загрузка из облака Telegram
        function loadData(callback) {
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.getItem('tamagotchi_data', (err, value) => {
                    if (!err && value) callback(JSON.parse(value));
                    else callback(null);
                });
            } else {
                const value = localStorage.getItem('tamagotchi_data');
                callback(value ? JSON.parse(value) : null);
            }
        }

        function checkState() {
            const now = Date.now();
            const timeSinceLastCare = (now - lastInteractionTime) / 1000;
            
            if (timeSinceLastCare > 10) {
                const cycles = Math.floor(timeSinceLastCare / 10);
                stats.hunger = Math.max(0, stats.hunger - (cycles * 2)); 
                stats.happiness = Math.max(0, stats.happiness - (cycles * 1));
            }

            if (timeSinceLastCare > 120 || stats.hunger < 30 || stats.happiness < 40) {
                character.style.backgroundImage = "url('sad1.gif')";
            } else {
                character.style.backgroundImage = "url('base.gif')";
            }
        }

        // --- ИНИЦИАЛИЗАЦИЯ ИГРЫ ---
        loadData((savedData) => {
            if (savedData) {
                stats.hunger = savedData.hunger;
                stats.happiness = savedData.happiness;
                lastInteractionTime = savedData.lastInteractionTime;
                speak("С возвращением!");
            } else {
                speak("Привет! Я мини жажас!");
            }
            
            checkState();

            // Запускаем игровой цикл
            setInterval(() => {
                checkState();
                saveData(); // Сохраняем каждые 10 секунд
            }, 10000);
        });

        // Кнопка FEED
        document.getElementById('btn-feed').addEventListener('click', () => {
            stats.hunger = 100;
            stats.happiness = Math.min(100, stats.happiness + 10);
            lastInteractionTime = Date.now(); 
            character.style.backgroundImage = "url('happy1.gif')"; 
            speak("Ням-ням! Вкусно! 🐟");
            saveData();
            setTimeout(checkState, 3000); 
        });

        // Кнопка KISS
        document.getElementById('btn-kiss').addEventListener('click', () => {
            stats.happiness = 100;
            lastInteractionTime = Date.now(); 
            character.style.backgroundImage = "url('kiss1.gif')"; 
            speak("Люблю тебя! ❤️");
            saveData();
            setTimeout(checkState, 2500); 
        });

    </script>
</body>
</html>
