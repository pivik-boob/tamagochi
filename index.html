<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Я Тамагочи: Взрывная версия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fce4ec; 
            --font-pixel: 'VT323', monospace;
            --heart-color: #FF0000; 
            --btn-text-color: #000000; 
        }

        body {
            background-color: var(--bg-color);
            background-image: url('bg.png'); 
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-pixel);
            image-rendering: pixelated; 
        }

        #screen-display {
            width: 100vw;
            height: 100vh;
            position: relative; 
            box-sizing: border-box;
            pointer-events: none; 
        }

        #top-bar {
            position: absolute;
            top: 25%; 
            left: 30%; 
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            height: 30px;
            z-index: 2;
            pointer-events: auto; 
        }

        #hearts-container {
            display: flex;
            gap: 5px;
        }
        
        .heart {
            width: 25px;
            height: 25px;
            fill: var(--heart-color);
            transition: fill 0.3s ease; /* Плавное затухание сердечек */
        }

        #clean-status {
            color: #00FF00; 
            font-size: 24px;
            position: absolute;
            right: -150%; 
        }
        
        #main-character-container {
            position: absolute;
            top: 30%; 
            left: 50%;
            transform: translateX(-50%); 
            width: 150px;
            height: 250px;
            z-index: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            box-sizing: border-box;
            pointer-events: auto;
        }

        #speech-bubble {
            position: absolute;
            top: -30px; 
            background: white;
            border: 2px solid black;
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 18px;
            color: black;
            white-space: nowrap;
            opacity: 0; 
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            pointer-events: none;
            z-index: 10;
        }
        
        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: black transparent transparent transparent;
        }
        
        #main-character {
            width: 100%;
            height: 100%;
            background-image: url('base.gif'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        #action-bar {
            position: absolute;
            top: 65%; 
            left: 50%;
            transform: translateX(-50%); 
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            width: 280px; 
            gap: 8px; 
            z-index: 3;
            pointer-events: auto; 
        }
        
        .action-btn {
            background-color: white; 
            color: var(--btn-text-color);
            font-size: 17px; 
            padding: 6px 12px; 
            border-radius: 8px;
            border: 2px solid #000; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.5); 
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
        }
        
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        /* Особый стиль для кнопки гидрокарбона при нажатии */
        #btn-hydrocarbon:active {
            background-color: #ffcccc;
        }

    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="screen-display">
        <div id="top-bar">
            <div id="hearts-container">
                <svg class="heart" id="heart-1" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart" id="heart-2" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart" id="heart-3" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div id="clean-status">CLEAN</div>
        </div>
        
        <div id="main-character-container">
            <div id="speech-bubble">Привет!</div>
            <div id="main-character"></div>
        </div>
        
        <div id="action-bar">
            <div class="action-btn" id="btn-feed">FEED</div>
            <div class="action-btn" id="btn-kiss">KISS</div>
            <div class="action-btn" id="btn-code">CODE</div>
            <div class="action-btn" id="btn-hydrocarbon">HYDROCARBON</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const character = document.getElementById('main-character');
        const speechBubble = document.getElementById('speech-bubble');
        
        let stats = { hunger: 50, happiness: 50 };
        let lastInteractionTime = Date.now(); 
        let speechTimeout;

        const bgMusic = document.getElementById('bg-music');
        document.body.addEventListener('click', () => {
            if (bgMusic && bgMusic.paused) {
                bgMusic.volume = 0.3; 
                bgMusic.play().catch(e => console.log("Ждем взаимодействия"));
            }
        }, { once: true });

        const randomPhrases = [
            "Жасмин, обними меня!",
            "Хочу тунец в собственном соку!",
            "Я скучала..."
        ];

        function speak(text, duration = 3000) {
            clearTimeout(speechTimeout);
            speechBubble.innerText = text;
            speechBubble.style.opacity = '1';
            speechTimeout = setTimeout(() => {
                speechBubble.style.opacity = '0';
            }, duration);
        }

        // Обновление интерфейса сердечек
        function updateUI() {
            const h1 = document.getElementById('heart-1');
            const h2 = document.getElementById('heart-2');
            const h3 = document.getElementById('heart-3');
            
            // Серые полупрозрачные сердца, если счастья не хватает
            const emptyColor = 'rgba(0, 0, 0, 0.3)';
            const fullColor = '#FF0000';

            h1.style.fill = stats.happiness > 10 ? fullColor : emptyColor;
            h2.style.fill = stats.happiness > 40 ? fullColor : emptyColor;
            h3.style.fill = stats.happiness > 70 ? fullColor : emptyColor;
        }

        function saveData() {
            const dataString = JSON.stringify({ hunger: stats.hunger, happiness: stats.happiness, lastInteractionTime });
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.setItem('tamagotchi_data', dataString, (err, success) => {});
            } else {
                localStorage.setItem('tamagotchi_data', dataString);
            }
        }

        function loadData(callback) {
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.getItem('tamagotchi_data', (err, value) => {
                    if (!err && value) callback(JSON.parse(value));
                    else callback(null);
                });
            } else {
                const value = localStorage.getItem('tamagotchi_data');
                callback(value ? JSON.parse(value) : null);
            }
        }

        function checkState() {
            const now = Date.now();
            const timeSinceLastCare = (now - lastInteractionTime) / 1000;
            
            if (timeSinceLastCare > 10) {
                const cycles = Math.floor(timeSinceLastCare / 10);
                stats.hunger = Math.max(0, stats.hunger - (cycles * 2)); 
                stats.happiness = Math.max(0, stats.happiness - (cycles * 1));
            }

            updateUI(); // Обновляем сердечки

            if (timeSinceLastCare > 120 || stats.hunger < 30 || stats.happiness < 40) {
                character.style.backgroundImage = "url('sad.gif')";
            } else {
                character.style.backgroundImage = "url('base.gif')";
            }
        }

        loadData((savedData) => {
            if (savedData) {
                stats.hunger = savedData.hunger;
                stats.happiness = savedData.happiness;
                lastInteractionTime = savedData.lastInteractionTime;
                speak("С возвращением!");
            } else {
                speak("Привет! Я мини жажас!");
            }
            
            checkState();

            setInterval(() => {
                checkState();
                saveData(); 
                
                if (Math.random() < 0.15 && character.style.backgroundImage.includes('base.gif')) {
                    const randomText = randomPhrases[Math.floor(Math.random() * randomPhrases.length)];
                    speak(randomText);
                }
            }, 10000);
        });

        // --- ДЕЙСТВИЯ КНОПОК ---
        
        document.getElementById('btn-feed').addEventListener('click', () => {
            stats.hunger = 100;
            stats.happiness = Math.min(100, stats.happiness + 10);
            lastInteractionTime = Date.now(); 
            character.style.backgroundImage = "url('happy.gif')"; 
            speak("Ням-ням! Вкусно! 🐟");
            updateUI();
            saveData();
            setTimeout(checkState, 3000); 
        });

        document.getElementById('btn-kiss').addEventListener('click', () => {
            stats.happiness = 100;
            lastInteractionTime = Date.now(); 
            character.style.backgroundImage = "url('kiss.gif')"; 
            speak("Люблю тебя! ❤️");
            updateUI();
            saveData();
            setTimeout(checkState, 2500); 
        });

        document.getElementById('btn-code').addEventListener('click', () => {
            stats.hunger = Math.max(0, stats.hunger - 15); 
            stats.happiness = Math.min(100, stats.happiness + 5);
            lastInteractionTime = Date.now(); 
            character.style.backgroundImage = "url('code.gif')"; 
            speak("Прохожу лабки на ТХМ 👩🏻‍💻");
            updateUI();
            saveData();
            setTimeout(checkState, 3500); 
        });

        // НОВАЯ КНОПКА: ГИДРОКАРБОН (ВЗРЫВ)
        document.getElementById('btn-hydrocarbon').addEventListener('click', () => {
            stats.happiness = 0; // Счастье падает до нуля, все сердца исчезают
            lastInteractionTime = Date.now(); 
            character.style.backgroundImage = "url('explode.gif')"; 
            speak("БУУУУМ! бльо 💥");
            updateUI(); // Сердечки мгновенно станут серыми
            saveData();
            
            // Через 3 секунды проверяем состояние (она автоматически станет грустной из-за счастья = 0)
            setTimeout(checkState, 3000); 
        });

    </script>
</body>
</html>
