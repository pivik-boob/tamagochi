<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мини-Я Тамагочи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #fce4ec;
            background-image: url('bg.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'VT323', monospace;
            image-rendering: pixelated;
        }

        /*
         * Весь UI накладывается на bg.png через абсолютное позиционирование.
         * Мы создаём «рамку экрана» — контейнер с теми же пропорциями, что и bg.png,
         * чтобы проценты внутри совпадали с реальными координатами на картинке.
         *
         * bg.png у тебя примерно 9:16 (портретная ориентация телефона).
         * Если твой bg.png другого размера — подправь aspect-ratio ниже.
         */

        #game-frame {
            position: relative;
            /* Занимаем максимум экрана, сохраняя пропорции bg.png */
            width: min(100vw, calc(100vh * 9 / 16));
            height: min(100vh, calc(100vw * 16 / 9));
            /* Координаты экрана устройства (зелёная область) внутри bg.png.
               Замеряй по своей картинке и подправляй эти 4 переменные. */
            --screen-top: 24%;     /* верхний край зелёного экрана */
            --screen-left: 22%;    /* левый край */
            --screen-width: 56%;   /* ширина экрана */
            --screen-height: 57%;  /* высота экрана */
        }

        /* Невидимый слой, повторяющий зону экрана устройства */
        #screen-area {
            position: absolute;
            top: var(--screen-top);
            left: var(--screen-left);
            width: var(--screen-width);
            height: var(--screen-height);
            /* outline: 2px dashed red; */ /* раскомментируй для отладки границ */
        }

        /* ── Верхняя панель: сердечки + CLEAN ── */
        #top-bar {
            position: absolute;
            top: 4%;
            left: 4%;
            right: 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #hearts-container {
            display: flex;
            gap: 4px;
        }

        .heart {
            width: 22px;
            height: 22px;
            fill: #FF0000;
            filter: drop-shadow(0 1px 0 #000);
        }

        .heart.empty {
            fill: #555;
            opacity: 0.4;
        }

        #clean-status {
            color: #00FF00;
            font-size: 22px;
            text-shadow: 1px 1px 0 #003300;
        }

        /* ── Облачко с текстом ── */
        #speech-bubble {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 2px solid black;
            border-radius: 10px;
            padding: 4px 14px;
            font-size: 16px;
            color: black;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 3px 0 rgba(0,0,0,0.25);
            pointer-events: none;
            z-index: 10;
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 9px 7px 0;
            border-style: solid;
            border-color: black transparent transparent;
        }

        /* ── Персонаж ── */
        #main-character-container {
            position: absolute;
            /* Верхняя треть экрана → нижняя часть */
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;      /* ширина гифки относительно экрана */
            height: 62%;     /* высота гифки */
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #main-character {
            width: 100%;
            height: 100%;
            background-image: url('base.gif');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            image-rendering: pixelated;
        }

        /* ── Кнопки FEED / KISS ── */
        #action-bar {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 5;
        }

        .action-btn {
            background-color: white;
            color: #000;
            font-family: 'VT323', monospace;
            font-size: 20px;
            padding: 6px 18px;
            border-radius: 6px;
            border: 2px solid #000;
            box-shadow: 0 4px 0 rgba(0,0,0,0.45);
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.45);
        }
    </style>
</head>
<body>

<div id="game-frame">
    <div id="screen-area">

        <!-- Верхняя панель -->
        <div id="top-bar">
            <div id="hearts-container">
                <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart empty" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart empty" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div id="clean-status">CLEAN</div>
        </div>

        <!-- Облачко -->
        <div id="speech-bubble">Привет!</div>

        <!-- Персонаж -->
        <div id="main-character-container">
            <div id="main-character"></div>
        </div>

        <!-- Кнопки -->
        <div id="action-bar">
            <div class="action-btn" id="btn-feed">FEED</div>
            <div class="action-btn" id="btn-kiss">KISS</div>
        </div>

    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const character   = document.getElementById('main-character');
    const speechBubble = document.getElementById('speech-bubble');
    const heartsEl    = document.getElementById('hearts-container');
    const cleanEl     = document.getElementById('clean-status');

    let stats = { hunger: 80, happiness: 80 };
    let lastInteractionTime = Date.now();
    let speechTimeout;

    const randomPhrases = [
        "Скучаю по тебе!",
        "Хочу кушать...",
        "Обними меня!",
        "Люблю тебя ❤️",
        "Побудь со мной?"
    ];

    /* ── Облачко ── */
    function speak(text, duration = 3000) {
        clearTimeout(speechTimeout);
        speechBubble.innerText = text;
        speechBubble.style.opacity = '1';
        speechTimeout = setTimeout(() => { speechBubble.style.opacity = '0'; }, duration);
    }

    /* ── Сердечки (0–5) ── */
    function updateHearts(value) {
        const filled = Math.round((value / 100) * 5);
        const hearts = heartsEl.querySelectorAll('.heart');
        hearts.forEach((h, i) => {
            h.classList.toggle('empty', i >= filled);
        });
    }

    /* ── Состояние персонажа ── */
    function checkState() {
        const now = Date.now();
        const elapsed = (now - lastInteractionTime) / 1000; // секунд

        if (elapsed > 10) {
            const cycles = Math.floor(elapsed / 10);
            stats.hunger    = Math.max(0, stats.hunger    - cycles * 2);
            stats.happiness = Math.max(0, stats.happiness - cycles * 1);
        }

        updateHearts(stats.happiness);
        cleanEl.style.color = stats.hunger > 30 ? '#00FF00' : '#FF4444';

        const isSad = elapsed > 120 || stats.hunger < 30 || stats.happiness < 40;
        character.style.backgroundImage = isSad ? "url('sad.gif')" : "url('base.gif')";
    }

    /* ── Сохранение / загрузка ── */
    function saveData() {
        const data = JSON.stringify({ hunger: stats.hunger, happiness: stats.happiness, lastInteractionTime });
        if (tg?.CloudStorage) {
            tg.CloudStorage.setItem('tamagotchi_data', data, err => { if (err) console.error(err); });
        } else {
            localStorage.setItem('tamagotchi_data', data);
        }
    }

    function loadData(cb) {
        if (tg?.CloudStorage) {
            tg.CloudStorage.getItem('tamagotchi_data', (err, val) => cb(!err && val ? JSON.parse(val) : null));
        } else {
            const val = localStorage.getItem('tamagotchi_data');
            cb(val ? JSON.parse(val) : null);
        }
    }

    /* ── Инициализация ── */
    loadData(saved => {
        if (saved) {
            stats.hunger            = saved.hunger;
            stats.happiness         = saved.happiness;
            lastInteractionTime     = saved.lastInteractionTime;
            speak('С возвращением! 💕');
        } else {
            speak('Привет! Ухаживай за мной! 💕');
        }
        checkState();

        setInterval(() => {
            checkState();
            saveData();
            if (Math.random() < 0.15 && !character.style.backgroundImage.includes('sad')) {
                speak(randomPhrases[Math.floor(Math.random() * randomPhrases.length)]);
            }
        }, 10000);
    });

    /* ── Кнопки ── */
    document.getElementById('btn-feed').addEventListener('click', () => {
        stats.hunger    = 100;
        stats.happiness = Math.min(100, stats.happiness + 10);
        lastInteractionTime = Date.now();
        character.style.backgroundImage = "url('happy.gif')";
        speak('Ням-ням! Вкусно! 🍓');
        saveData();
        setTimeout(checkState, 3000);
    });

    document.getElementById('btn-kiss').addEventListener('click', () => {
        stats.happiness = 100;
        lastInteractionTime = Date.now();
        character.style.backgroundImage = "url('kiss.gif')";
        speak('Люблю тебя! ❤️');
        saveData();
        setTimeout(checkState, 2500);
    });
</script>
</body>
</html>
